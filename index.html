<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BillTrack</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2EC;--surface:#FFFEFB;--surface2:#F0EDE6;
  --ink:#1A1812;--ink2:#6B6659;--ink3:#A09D94;
  --accent:#C9430A;--border:#E0DBD2;--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);font-size:16px;min-height:100vh}
button,select,input{font-family:inherit;touch-action:manipulation}
.header{background:var(--ink);color:#fff;padding:18px 20px;display:flex;align-items:baseline;gap:10px;position:sticky;top:0;z-index:100}
.header h1{font-family:'DM Serif Display',serif;font-size:22px}
.header span{font-size:12px;opacity:0.5}
.nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;position:sticky;top:56px;z-index:99}
.nav-btn{flex:1;padding:13px 8px;border:none;background:none;font-size:13px;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.content{padding:16px;max-width:480px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.metrics.three{grid-template-columns:1fr 1fr 1fr}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px}
.metric-label{font-size:11px;color:var(--ink3);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:4px}
.metric-value{font-family:'DM Serif Display',serif;font-size:24px;color:var(--ink);line-height:1}
.form-label{font-size:12px;color:var(--ink2);margin-bottom:5px;display:block;font-weight:500}
.form-input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:16px;background:var(--bg);color:var(--ink);-webkit-appearance:none}
.form-input:focus{outline:none;border-color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.form-group{margin-bottom:12px}
.btn{padding:14px 18px;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(0.98)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);width:100%;font-size:17px;min-height:54px;font-weight:500}
.btn-primary:active{background:#8A2D08}
.btn-primary:disabled{opacity:0.6}
.receipt-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;border:1.5px dashed var(--border);border-radius:var(--radius);background:none;cursor:pointer;color:var(--ink2);font-size:13px;width:100%;min-height:80px}
.receipt-btn:active{border-color:var(--accent);color:var(--accent)}
.receipt-btn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6}
.bill-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.bill-item:last-child{border-bottom:none}
.bill-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.bill-info{flex:1;min-width:0}
.bill-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill-meta{font-size:12px;color:var(--ink3);margin-top:2px}
.bill-amount{font-size:15px;font-weight:500;white-space:nowrap;font-family:'DM Serif Display',serif}
.del-btn{background:none;border:none;cursor:pointer;color:var(--ink3);font-size:22px;line-height:1;padding:8px 10px;flex-shrink:0;min-height:44px;min-width:44px}
.del-btn:active{color:var(--accent)}
.cat-badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;display:inline-block}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-label{font-size:12px;color:var(--ink2);min-width:80px}
.bar-track{flex:1;background:var(--surface2);border-radius:4px;height:8px;overflow:hidden}
.bar-fill{height:8px;border-radius:4px;transition:width 0.4s}
.bar-val{font-size:12px;color:var(--ink2);min-width:80px;text-align:right}
.sec-title{font-size:11px;font-weight:500;letter-spacing:0.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:12px}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--ink3);font-size:14px}
.empty svg{width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:1.2;margin:0 auto 10px;display:block;opacity:0.4}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:24px;font-size:14px;transition:transform 0.3s;z-index:999;white-space:nowrap;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.receipt-note{font-size:13px;color:var(--ink3);margin-top:8px;min-height:18px}
.filter-select{padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--surface);color:var(--ink);-webkit-appearance:none;min-height:42px}
.hidden{display:none}
.drag-handle{cursor:grab;color:var(--ink3);padding:8px;flex-shrink:0;display:flex;align-items:center;touch-action:none}
.drag-handle svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.bill-item.dragging{opacity:0.4}
.bill-item.drag-over{border-top:2px solid var(--accent)}
</style>
</head>
<body>

<div class="header"><h1>BillTrack</h1><span>Penang Expense Diary</span></div>

<nav class="nav">
  <button class="nav-btn active" id="nav-add" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Add</button>
  <button class="nav-btn" id="nav-daily" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Today</button>
  <button class="nav-btn" id="nav-weekly" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Week</button>
  <button class="nav-btn" id="nav-all" type="button"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1"/><circle cx="3" cy="12" r="1"/><circle cx="3" cy="18" r="1"/></svg>All</button>
</nav>

<div id="tab-add" class="content">
  <div class="card">
    <div class="sec-title">Scan receipt</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <button class="receipt-btn" type="button" id="cam-btn"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>Take photo</button>
      <button class="receipt-btn" type="button" id="up-btn"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Upload file</button>
    </div>
    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none">
    <input type="file" id="upload-input" accept="image/*,.pdf" style="display:none">
    <div id="receipt-preview" style="display:none;margin:8px 0;text-align:center">
      <img id="receipt-img" style="max-width:100%;max-height:160px;border-radius:8px;border:1px solid var(--border)">
    </div>
    <div class="receipt-note" id="receipt-note"></div>
  </div>

  <div class="card">
    <div class="sec-title">Manual entry</div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <input class="form-input" type="text" id="b-name" placeholder="e.g. Grab food, TNB bill" autocomplete="off">
    </div>
    <div class="form-row">
      <div>
        <label class="form-label">Amount (RM)</label>
        <input class="form-input" type="number" id="b-amount" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
      </div>
      <div>
        <label class="form-label">Date</label>
        <input class="form-input" type="date" id="b-date">
      </div>
    </div>
    <div class="form-row">
      <div>
        <label class="form-label">Category</label>
        <select class="form-input" id="b-cat">
          <option value="food">🍜 Food</option>
          <option value="grocery">🛒 Grocery</option>
          <option value="transport">🚗 Transport</option>
          <option value="utilities">💡 Utility</option>
          <option value="health">💊 Health</option>
          <option value="entertainment">🎬 Fun</option>
          <option value="other">📦 Other</option>
        </select>
      </div>
      <div>
        <label class="form-label">Payment</label>
        <select class="form-input" id="b-pay">
          <option value="applepay">🍎 Apple Pay</option>
          <option value="tng">💚 TNG</option>
          <option value="grabpay">🟢 GrabPay</option>
          <option value="debit">💳 Debit</option>
          <option value="credit">💳 Credit</option>
          <option value="cash">💵 Cash</option>
          <option value="bank">🏦 Bank</option>
          <option value="boost">⚡ Boost</option>
          <option value="other">📦 Other</option>
        </select>
      </div>
    </div>
    <input class="form-input" type="text" id="b-pay-custom" placeholder="Custom payment name" style="display:none;margin-bottom:12px">
    <button class="btn btn-primary" type="button" id="add-btn">Add bill</button>
  </div>
</div>

<div id="tab-daily" class="content hidden">
  <div class="metrics three" id="daily-metrics"></div>
  <div class="card"><div class="sec-title">Today's bills</div><div id="daily-list"></div></div>
</div>

<div id="tab-weekly" class="content hidden">
  <div class="metrics" id="weekly-metrics"></div>
  <div class="card"><div class="sec-title">By category</div><div id="weekly-cats"></div></div>
  <div class="card"><div class="sec-title">Day by day</div><div id="weekly-days"></div></div>
</div>

<div id="tab-all" class="content hidden">
  <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
    <select class="filter-select" id="filter-cat" style="flex:1;min-width:120px">
      <option value="">All categories</option>
      <option value="food">Food</option><option value="grocery">Grocery</option><option value="transport">Transport</option>
      <option value="utilities">Utility</option><option value="health">Health</option><option value="entertainment">Fun</option><option value="other">Other</option>
    </select>
    <select class="filter-select" id="filter-pay" style="flex:1;min-width:120px">
      <option value="">All methods</option>
      <option value="applepay">Apple Pay</option><option value="tng">TNG</option><option value="grabpay">GrabPay</option>
      <option value="debit">Debit</option><option value="credit">Credit</option><option value="cash">Cash</option>
      <option value="bank">Bank</option><option value="boost">Boost</option><option value="other">Other</option>
    </select>
    <button class="btn" type="button" id="clear-btn" style="font-size:13px;padding:8px 14px;color:var(--accent);border-color:var(--accent);min-height:42px">Clear all</button>
  </div>
  <div id="all-list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

// ───────── State ─────────
let bills = [];
try { bills = JSON.parse(localStorage.getItem('billtrack_v3') || '[]'); } catch(e){ bills = []; }

const CAT = {
  food:{label:'Food',color:'#2D6A4F',bg:'#D8F3DC',dot:'#2D6A4F'},
  grocery:{label:'Grocery',color:'#0D6E5B',bg:'#D4EDE8',dot:'#0D6E5B'},
  transport:{label:'Transport',color:'#1B4F7A',bg:'#DAEAF5',dot:'#1B4F7A'},
  utilities:{label:'Utility',color:'#7A4F00',bg:'#FFF3CD',dot:'#BA7517'},
  health:{label:'Health',color:'#7A1B4F',bg:'#F5D5E8',dot:'#D4537E'},
  entertainment:{label:'Fun',color:'#3D2B8A',bg:'#E8E4F7',dot:'#7F77DD'},
  other:{label:'Other',color:'#4A4740',bg:'#EBEBEB',dot:'#888780'}
};
const PAY = {
  applepay:{label:'Apple Pay',icon:'🍎'},tng:{label:'TNG',icon:'💚'},grabpay:{label:'GrabPay',icon:'🟢'},
  debit:{label:'Debit',icon:'💳'},credit:{label:'Credit',icon:'💳'},cash:{label:'Cash',icon:'💵'},
  bank:{label:'Bank',icon:'🏦'},boost:{label:'Boost',icon:'⚡'},other:{label:'Other',icon:'📦'}
};

let pendingReceipt = null; // {base64, mime}

// ───────── Utilities ─────────
function $(id){ return document.getElementById(id); }
function today(){ return new Date().toISOString().split('T')[0]; }
function fmtDate(d){ const p=d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmtRM(n){ return 'RM '+Number(n).toFixed(2); }
function save(){ try{ localStorage.setItem('billtrack_v3', JSON.stringify(bills)); }catch(e){} }

function toast(msg){
  const el=$('toast'); el.textContent=msg; el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2200);
}

// ───────── Tabs ─────────
function showTab(t){
  ['add','daily','weekly','all'].forEach(function(id){
    $('tab-'+id).classList.add('hidden');
    $('nav-'+id).classList.remove('active');
  });
  $('tab-'+t).classList.remove('hidden');
  $('nav-'+t).classList.add('active');
  if(t==='daily') renderDaily();
  if(t==='weekly') renderWeekly();
  if(t==='all') renderAll();
}

// ───────── Add Bill ─────────
function getPayValue(){
  const sel=$('b-pay');
  if(sel.value==='other'){
    const custom=$('b-pay-custom').value.trim();
    return custom || 'other';
  }
  return sel.value;
}

async function addBill(){
  const name=$('b-name').value.trim();
  const amount=parseFloat($('b-amount').value);
  const cat=$('b-cat').value;
  const pay=getPayValue();
  const date=$('b-date').value || today();
  if(!name){ toast('Please enter description'); $('b-name').focus(); return; }
  if(isNaN(amount)||amount<=0){ toast('Please enter valid amount'); $('b-amount').focus(); return; }

  const btn=$('add-btn');
  btn.textContent='Saving…'; btn.disabled=true;

  bills.unshift({ id:Date.now(), name:name, amount:amount, cat:cat, pay:pay, date:date, driveLink:null });
  save();

  $('b-name').value='';
  $('b-amount').value='';
  $('b-date').value=today();
  $('b-pay-custom').value='';
  $('b-pay-custom').style.display='none';
  $('receipt-preview').style.display='none';
  $('receipt-img').src='';
  $('receipt-note').textContent='';
  pendingReceipt=null;

  btn.textContent='✓ Saved!'; btn.disabled=false;
  setTimeout(function(){ btn.textContent='Add bill'; }, 1500);
  toast('Bill added: '+name);
}

function deleteBill(id){
  if(!confirm('Delete this bill?')) return;
  bills=bills.filter(function(b){ return b.id!==id; });
  save(); renderDaily(); renderWeekly(); renderAll();
  toast('Deleted');
}

function clearAll(){
  if(!confirm('Delete ALL bills? This cannot be undone.')) return;
  bills=[]; save(); renderAll(); toast('All cleared');
}

// ───────── Rendering ─────────
function billItem(b){
  const c=CAT[b.cat]||CAT.other;
  let payHtml='';
  if(b.pay){
    if(PAY[b.pay]) payHtml=' · '+PAY[b.pay].icon+' '+PAY[b.pay].label;
    else payHtml=' · 📦 '+b.pay;
  }
  return '<div class="bill-item" data-id="'+b.id+'">'+
    '<div class="bill-dot" style="background:'+c.dot+'"></div>'+
    '<div class="bill-info">'+
      '<div class="bill-name">'+escapeHtml(b.name)+'</div>'+
      '<div class="bill-meta"><span class="cat-badge" style="background:'+c.bg+';color:'+c.color+'">'+c.label+'</span>'+payHtml+' · '+fmtDate(b.date)+'</div>'+
    '</div>'+
    '<div class="bill-amount">'+fmtRM(b.amount)+'</div>'+
    '<button class="del-btn" type="button" data-del="'+b.id+'">×</button>'+
  '</div>';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function renderDaily(){
  const tod=today();
  const tb=bills.filter(function(b){ return b.date===tod; });
  const total=tb.reduce(function(s,b){ return s+b.amount; }, 0);
  const cats=Array.from(new Set(tb.map(function(b){ return b.cat; }))).length;
  $('daily-metrics').innerHTML=
    '<div class="metric"><div class="metric-label">Today</div><div class="metric-value">'+fmtRM(total)+'</div></div>'+
    '<div class="metric"><div class="metric-label">Bills</div><div class="metric-value">'+tb.length+'</div></div>'+
    '<div class="metric"><div class="metric-label">Categories</div><div class="metric-value">'+cats+'</div></div>';
  $('daily-list').innerHTML = tb.length
    ? tb.map(billItem).join('')
    : '<div class="empty">No bills today yet</div>';
}

function getWeekBounds(){
  const d=new Date(), day=d.getDay();
  const mon=new Date(d); mon.setDate(d.getDate()-(day===0?6:day-1));
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  return { start:mon.toISOString().split('T')[0], end:sun.toISOString().split('T')[0] };
}

function renderWeekly(){
  const w=getWeekBounds();
  const wb=bills.filter(function(b){ return b.date>=w.start && b.date<=w.end; });
  const total=wb.reduce(function(s,b){ return s+b.amount; }, 0);
  $('weekly-metrics').innerHTML=
    '<div class="metric"><div class="metric-label">This week</div><div class="metric-value">'+fmtRM(total)+'</div></div>'+
    '<div class="metric"><div class="metric-label">Daily avg</div><div class="metric-value">'+fmtRM(total/7)+'</div></div>';

  const byCat={};
  wb.forEach(function(b){ byCat[b.cat]=(byCat[b.cat]||0)+b.amount; });
  const maxC=Math.max.apply(null, Object.values(byCat).concat([1]));
  const catHtml=Object.entries(byCat).sort(function(a,b){ return b[1]-a[1]; }).map(function(e){
    const cat=e[0], amt=e[1];
    const c=CAT[cat]||CAT.other;
    return '<div class="bar-row"><span class="bar-label">'+c.label+'</span><div class="bar-track"><div class="bar-fill" style="width:'+(amt/maxC*100).toFixed(1)+'%;background:'+c.dot+'"></div></div><span class="bar-val">'+fmtRM(amt)+'</span></div>';
  }).join('');
  $('weekly-cats').innerHTML = catHtml || '<div class="empty" style="padding:1rem">No bills this week</div>';

  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const byDay={};
  for(let i=0;i<7;i++){ const d=new Date(w.start); d.setDate(d.getDate()+i); byDay[d.toISOString().split('T')[0]]=0; }
  wb.forEach(function(b){ if(byDay[b.date]!==undefined) byDay[b.date]+=b.amount; });
  const maxD=Math.max.apply(null, Object.values(byDay).concat([1]));
  $('weekly-days').innerHTML = Object.entries(byDay).map(function(e,i){
    const amt=e[1];
    return '<div class="bar-row"><span class="bar-label">'+days[i]+'</span><div class="bar-track"><div class="bar-fill" style="width:'+(amt/maxD*100).toFixed(1)+'%;background:#378ADD"></div></div><span class="bar-val">'+(amt>0?fmtRM(amt):'-')+'</span></div>';
  }).join('');
}

function renderAll(){
  const cat=$('filter-cat').value;
  const pay=$('filter-pay').value;
  let filtered=bills;
  if(cat) filtered=filtered.filter(function(b){ return b.cat===cat; });
  if(pay) filtered=filtered.filter(function(b){ return b.pay===pay; });
  $('all-list').innerHTML = filtered.length
    ? filtered.map(billItem).join('')
    : '<div class="empty">No bills recorded yet</div>';
}

// ───────── Receipt Scanning ─────────
function handleReceiptFile(file){
  if(!file) return;
  const note=$('receipt-note');
  note.textContent='Reading receipt…';
  const reader=new FileReader();
  reader.onload=async function(e){
    const dataUrl=e.target.result;
    const base64=dataUrl.split(',')[1];
    const mt=file.type || 'image/jpeg';
    pendingReceipt={ base64:base64, mime:mt };
    if(mt.indexOf('image/')===0){
      $('receipt-img').src=dataUrl;
      $('receipt-preview').style.display='block';
    }
    try {
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:400,
          messages:[{role:'user', content:[
            { type: mt==='application/pdf' ? 'document' : 'image', source:{type:'base64',media_type:mt,data:base64} },
            { type:'text', text:'Extract from this receipt or bank/wallet transaction screenshot: merchant name, amount as number, date YYYY-MM-DD, category (food/grocery/transport/utilities/health/entertainment/other), payment method (applepay/tng/grabpay/debit/credit/cash/bank/boost/other). Reply ONLY JSON: {"name":"...","amount":0.00,"date":"YYYY-MM-DD","cat":"food","pay":"credit"}. Today is '+today()+'.' }
          ]}]
        })
      });
      const data=await res.json();
      const txt=data.content.map(function(i){ return i.text||''; }).join('');
      const clean=txt.replace(/```json|```/g,'').trim();
      const parsed=JSON.parse(clean);
      if(parsed.name) $('b-name').value=parsed.name;
      if(parsed.amount) $('b-amount').value=parsed.amount;
      if(parsed.date) $('b-date').value=parsed.date;
      if(parsed.cat){ const sel=$('b-cat'); if(Array.from(sel.options).some(function(o){ return o.value===parsed.cat; })) sel.value=parsed.cat; }
      if(parsed.pay){ const sel=$('b-pay'); if(Array.from(sel.options).some(function(o){ return o.value===parsed.pay; })) sel.value=parsed.pay; }
      note.innerHTML='✓ '+(parsed.name||'Receipt')+' — RM '+(parsed.amount||0)+' detected. Review and tap Add bill.';
    } catch(err){
      note.textContent='Could not auto-read. Please fill in manually.';
    }
  };
  reader.readAsDataURL(file);
}

// ───────── Event Wiring ─────────
function init(){
  // Nav tabs — use addEventListener with both click and touchend
  ['add','daily','weekly','all'].forEach(function(t){
    const el=$('nav-'+t);
    el.addEventListener('click', function(){ showTab(t); });
  });

  // Add button
  $('add-btn').addEventListener('click', addBill);

  // Payment method toggle
  $('b-pay').addEventListener('change', function(){
    $('b-pay-custom').style.display = this.value==='other' ? 'block' : 'none';
    if(this.value!=='other') $('b-pay-custom').value='';
  });

  // Receipt buttons
  $('cam-btn').addEventListener('click', function(){ $('camera-input').click(); });
  $('up-btn').addEventListener('click', function(){ $('upload-input').click(); });
  $('camera-input').addEventListener('change', function(e){ handleReceiptFile(e.target.files[0]); });
  $('upload-input').addEventListener('change', function(e){ handleReceiptFile(e.target.files[0]); });

  // Filters
  $('filter-cat').addEventListener('change', renderAll);
  $('filter-pay').addEventListener('change', renderAll);
  $('clear-btn').addEventListener('click', clearAll);

  // Delete buttons (event delegation)
  document.body.addEventListener('click', function(e){
    const del=e.target.closest('[data-del]');
    if(del){
      e.preventDefault();
      deleteBill(parseInt(del.dataset.del));
    }
  });

  // Set default date
  $('b-date').value=today();

  // URL params (Apple Pay shortcut integration)
  const p=new URLSearchParams(window.location.search);
  if(p.get('amount')){
    const a=parseFloat(p.get('amount'));
    if(!isNaN(a) && a>0){
      bills.unshift({
        id:Date.now(),
        name:p.get('name')||'Apple Pay',
        amount:a,
        cat:p.get('cat')||'other',
        pay:p.get('source')||'applepay',
        date:p.get('date')||today(),
        driveLink:null
      });
      save();
      window.history.replaceState({}, '', window.location.pathname);
      setTimeout(function(){ toast('✓ Auto-added: RM '+a.toFixed(2)); }, 500);
    }
  }
}

// Boot
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
