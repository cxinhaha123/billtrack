<style>

  --blue:#1B4F7A;
  --blue-bg:#DAEAF5;
  --amber:#7A4F00;

  --pink:#7A1B4F;
  --pink-bg:#F5D5E8;
  --teal:#0D6E5B;

}

body{

}
/* Header */
.header{
  background:var(--ink);
  color:#fff;
  padding:18px 20px 16px;

}

  font-family:'DM Serif Display',serif;

  letter-spacing:-0.3px;
}

  font-size:12px;

}
/* Nav tabs */
.nav{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;
  overflow-x:auto;
  scrollbar-width:none;
  position:sticky;

}
.nav::-webkit-scrollbar{display:none}
.nav-btn{

  cursor:pointer;
  border-bottom:2px solid transparent;
  display:flex;
  flex-direction:column;
  align-items:center;

  transition:color 0.15s;
  white-space:nowrap;

}

/* Content */
.content{padding:16px;max-width:480px;margin:0 auto}
/* Cards */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
}
/* Metrics */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.metrics.three{grid-template-columns:1fr 1fr 1fr}
.metric{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px 12px;
}
.metric-label{font-size:11px;color:var(--ink3);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:4px}
.metric-value{font-family:'DM Serif Display',serif;font-size:26px;color:var(--ink);line-height:1}
.metric-value.sm{font-size:20px}
/* Form */
.form-label{font-size:12px;color:var(--ink2);margin-bottom:5px;display:block;font-weight:500}

}

/* Toast */
.toast{

/* Receipt status */
.receipt-note{font-size:12px;color:var(--ink3);margin-top:6px;min-height:16px}
/* WhatsApp preview */

/* Filter */
.filter-select{

  -webkit-appearance:none;

</style>

<script>
let bills = JSON.parse(localStorage.getItem('billtrack_v2') || '[]');

// Apple Pay Shortcut auto-add via URL params
// Usage: billtrack.html?name=Starbucks&amount=12.50&cat=food&source=applepay
(function handleURLParams(){
  const p = new URLSearchParams(window.location.search);
  if(!p.get('amount')) return;
  const name    = p.get('name')   || 'Apple Pay';
  const amount  = parseFloat(p.get('amount'));
  const cat     = p.get('cat')    || 'other';
  const source  = p.get('source') || '';
  const dateVal = p.get('date')   || new Date().toISOString().split('T')[0];
  if(isNaN(amount)||amount<=0) return;
  bills.unshift({id:Date.now(), name, amount, cat, date:dateVal, driveLink:null, source});
  try{localStorage.setItem('billtrack_v2', JSON.stringify(bills));}catch(e){}
  // Clean URL so refresh doesn't duplicate
  window.history.replaceState({}, '', window.location.pathname);
  // Show confirmation banner after page loads
  window.addEventListener('DOMContentLoaded', ()=>{
    setTimeout(()=>toast('✓ Apple Pay — '+name+' RM '+amount.toFixed(2)+' added'), 400);
  });
})();

const CAT = {
  food:{label:'Food & drink',color:'#2D6A4F',bg:'#D8F3DC'},
  grocery:{label:'Grocery',color:'#0D6E5B',bg:'#D4EDE8'},
  transport:{label:'Transport',color:'#1B4F7A',bg:'#DAEAF5'},
  utilities:{label:'Utility',color:'#7A4F00',bg:'#FFF3CD'},
  health:{label:'Health',color:'#7A1B4F',bg:'#F5D5E8'},
  entertainment:{label:'Entertain',color:'#3D2B8A',bg:'#E8E4F7'},
  other:{label:'Other',color:'#4A4740',bg:'#EBEBEB'}
};
const DOT_COLORS = {food:'#2D6A4F',grocery:'#0D6E5B',transport:'#1B4F7A',utilities:'#BA7517',health:'#D4537E',entertainment:'#7F77DD',other:'#888780'};
const PAY = {applepay:{label:'Apple Pay',icon:'🍎'},tng:{label:'TNG',icon:'💚'},grabpay:{label:'GrabPay',icon:'🟢'},debit:{label:'Debit',icon:'💳'},credit:{label:'Credit',icon:'💳'},cash:{label:'Cash',icon:'💵'},bank:{label:'Bank',icon:'🏦'},boost:{label:'Boost',icon:'⚡'},other:{label:'Other',icon:'📦'}};

function save(){localStorage.setItem('billtrack_v2',JSON.stringify(bills))}

function onPayChange(){
  const sel=document.getElementById('b-pay');
  const box=document.getElementById('b-pay-custom');
  box.style.display=sel.value==='other'?'block':'none';
  if(sel.value!=='other')box.value='';
}
function syncCustomPay(){
  // keeps custom text in sync — read via getPayValue()
}
function getPayValue(){
  const sel=document.getElementById('b-pay');
  if(sel.value==='other'){
    const custom=document.getElementById('b-pay-custom').value.trim();
    return custom||'other';
  }
  return sel.value;
}

function today(){return new Date().toISOString().split('T')[0]}
function fmtDate(d){const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`}
function fmtRM(n){return'RM '+n.toFixed(2)}

document.getElementById('b-date').value = today();

function showTab(t){
  ['add','daily','weekly','all'].forEach(id=>{
    document.getElementById('tab-'+id).classList.add('hidden');
    document.getElementById('nav-'+id).classList.remove('active');
  });
  document.getElementById('tab-'+t).classList.remove('hidden');
  document.getElementById('nav-'+t).classList.add('active');
  if(t==='daily')renderDaily();
  if(t==='weekly')renderWeekly();
  if(t==='all')renderAll();
}

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}

async function addBill(){
  const name=document.getElementById('b-name').value.trim();
  const amount=parseFloat(document.getElementById('b-amount').value);
  const cat=document.getElementById('b-cat').value;
  const pay=getPayValue();
  const date=document.getElementById('b-date').value;
  if(!name||isNaN(amount)||amount<=0){toast('Please enter description and amount');return;}
  const btn=document.getElementById('add-btn');
  btn.textContent='Saving…';btn.disabled=true;
  let driveLink=null;
  if(pendingReceiptBase64){
    const note=document.getElementById('receipt-note');
    note.textContent='Uploading receipt to Google Drive…';
    driveLink=await uploadReceiptToDrive(name,date);
    note.innerHTML=driveLink
      ?'✓ Saved to Google Drive — <a href="'+driveLink+'" target="_blank" style="color:var(--accent)">view receipt</a>'
      :'Receipt upload failed — bill saved without attachment.';
  }
  bills.unshift({id:Date.now(),name,amount,cat,pay,date,driveLink});
  save();
  document.getElementById('b-name').value='';
  document.getElementById('b-amount').value='';
  document.getElementById('b-date').value=today();
  document.getElementById('receipt-preview').style.display='none';
  document.getElementById('receipt-img').src='';
  btn.textContent='✓ Saved!';btn.disabled=false;
  setTimeout(()=>btn.textContent='Add bill',1400);
  toast(driveLink?'Bill added + receipt on Drive':'Bill added');
}

function deleteBill(id){
  if(!confirm('Delete this bill?'))return;
  bills=bills.filter(b=>b.id!==id);save();
  renderDaily();renderWeekly();renderAll();toast('Deleted');
}

function clearAll(){
  if(!confirm('Delete ALL bills? This cannot be undone.'))return;
  bills=[];save();renderAll();toast('All bills cleared');
}

function billItem(b){
  const c=CAT[b.cat]||CAT.other;
  const driveIcon=b.driveLink
    ?`<a href="${b.driveLink}" target="_blank" title="View receipt on Google Drive" style="color:#2D6A4F;display:flex;align-items:center;padding:4px 5px;border-radius:4px;text-decoration:none;flex-shrink:0">
        <svg width="14" height="14" viewBox="0 0 87.3 78" fill="currentColor"><path d="M6.6 66.85l3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3L27.5 53.4H0c0 1.55.4 3.1 1.2 4.5zm73.7-40.2L66.6 3.4C65.8 2 64.65.9 63.3.1L50 23.7h26.5c0-1.55-.4-3.1-1.2-4.5zM43.65 26.9L30.5 3.4c-1.35.8-2.5 1.9-3.3 3.3L1 51.95c-.8 1.4-1.2 2.95-1.2 4.5h28.7zm7.2 3.8h26.5l-26.5-45.9c-1.35-.8-2.9-1.2-4.5-1.2s-3.15.4-4.5 1.2L28.5 30.7h26.5zM27.5 56.8l-13.8 23.9c1.35.8 2.9 1.2 4.5 1.2h63.3c1.6 0 3.15-.4 4.5-1.2L72.25 56.8H27.5z"/></svg>
      </a>`
    :'';
  return`<div class="bill-item" data-id="${b.id}" draggable="true">
    <div class="drag-handle" title="Drag to reorder"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="18" x2="16" y2="18"/></svg></div>
    <div class="bill-dot" style="background:${DOT_COLORS[b.cat]||'#888'}"></div>
    <div class="bill-info">
      <div class="bill-name">${b.name}</div>
      <div class="bill-meta"><span class="cat-badge" style="background:${c.bg};color:${c.color}">${c.label}</span>${b.pay?(PAY[b.pay]?' · <span style="font-size:11px">'+PAY[b.pay].icon+' '+PAY[b.pay].label+'</span>':' · <span style="font-size:11px">📦 '+b.pay+'</span>'):''} · ${fmtDate(b.date)}</div>
    </div>
    <div class="bill-amount">${fmtRM(b.amount)}</div>
    ${driveIcon}
    <button class="del-btn" onclick="deleteBill(${b.id})" title="Delete">x</button>
  </div>`;
}

function renderDaily(){
  const tod=today();
  const tb=bills.filter(b=>b.date===tod);
  const total=tb.reduce((s,b)=>s+b.amount,0);
  const cats=[...new Set(tb.map(b=>b.cat))].length;
  document.getElementById('daily-metrics').innerHTML=`
    <div class="metric"><div class="metric-label">Total today</div><div class="metric-value sm">${fmtRM(total)}</div></div>
    <div class="metric"><div class="metric-label">Bills</div><div class="metric-value">${tb.length}</div></div>
    <div class="metric"><div class="metric-label">Categories</div><div class="metric-value">${cats}</div></div>`;
  document.getElementById('daily-list').innerHTML=tb.length
    ?tb.map(billItem).join('')
    :`<div class="empty"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>No bills today yet</div>`;
}

function getWeekBounds(){
  const d=new Date(),day=d.getDay(),mon=new Date(d);
  mon.setDate(d.getDate()-(day===0?6:day-1));
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  return{start:mon.toISOString().split('T')[0],end:sun.toISOString().split('T')[0]};
}

function renderWeekly(){
  const{start,end}=getWeekBounds();
  const wb=bills.filter(b=>b.date>=start&&b.date<=end);
  const total=wb.reduce((s,b)=>s+b.amount,0);
  const avg=total/7;
  document.getElementById('weekly-metrics').innerHTML=`
    <div class="metric"><div class="metric-label">This week</div><div class="metric-value sm">${fmtRM(total)}</div></div>
    <div class="metric"><div class="metric-label">Daily avg</div><div class="metric-value sm">${fmtRM(avg)}</div></div>`;

  const byCat={};
  wb.forEach(b=>{byCat[b.cat]=(byCat[b.cat]||0)+b.amount});
  const maxC=Math.max(...Object.values(byCat),1);
  document.getElementById('weekly-cats').innerHTML=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>`
    <div class="bar-row">
      <span class="bar-label">${CAT[cat]?.label||cat}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${(amt/maxC*100).toFixed(1)}%;background:${DOT_COLORS[cat]||'#888'}"></div></div>
      <span class="bar-val">${fmtRM(amt)}</span>
    </div>`).join('')||'<div class="empty" style="padding:1rem">No bills this week</div>';

  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const byDay={};
  for(let i=0;i<7;i++){const d=new Date(start);d.setDate(d.getDate()+i);byDay[d.toISOString().split('T')[0]]=0}
  wb.forEach(b=>{if(byDay[b.date]!==undefined)byDay[b.date]+=b.amount});
  const maxD=Math.max(...Object.values(byDay),1);
  document.getElementById('weekly-days').innerHTML=Object.entries(byDay).map(([date,amt],i)=>`
    <div class="bar-row">
      <span class="bar-label">${days[i]}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${(amt/maxD*100).toFixed(1)}%;background:#378ADD"></div></div>
      <span class="bar-val">${amt>0?fmtRM(amt):'-'}</span>
    </div>`).join('');
}

    else{tb.forEach(b=>{lines.push(`• ${b.name} — RM ${b.amount.toFixed(2)}`);})}
    lines.push('');
    lines.push(`──────────────────`);
    lines.push(`*Total: RM ${total.toFixed(2)}*`);
  } else {
    const wb=bills.filter(b=>b.date>=start&&b.date<=end);
    const total=wb.reduce((s,b)=>s+b.amount,0);
    lines.push(`📊 *Weekly Summary – ${fmtDate(start)} to ${fmtDate(end)}*`);
    lines.push('');
    const byCat={};
    wb.forEach(b=>{byCat[b.cat]=(byCat[b.cat]||0)+b.amount});
    if(Object.keys(byCat).length===0){lines.push('No bills this week.')}
    else{
      Object.entries(byCat).sort((a,b)=>b[1]-a[1]).forEach(([cat,amt])=>{
        lines.push(`• ${CAT[cat]?.label||cat}: RM ${amt.toFixed(2)}`);
      });
    }
    lines.push('');
    lines.push(`──────────────────`);
    lines.push(`*Total: RM ${total.toFixed(2)}*`);
    lines.push(`*Daily avg: RM ${(total/7).toFixed(2)}*`);
  }
  lines.push('');
  lines.push('_Sent via BillTrack_');
  return lines.join('\n');
}




function renderAll(){
  const cat=document.getElementById('filter-cat').value;
  const pay=document.getElementById('filter-pay').value;
  let filtered=bills;
  if(cat)filtered=filtered.filter(b=>b.cat===cat);
  if(pay)filtered=filtered.filter(b=>b.pay===pay);
  document.getElementById('all-list').innerHTML=filtered.length
    ?filtered.map(billItem).join('')
    :`<div class="empty"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1"/><circle cx="3" cy="12" r="1"/><circle cx="3" cy="18" r="1"/></svg>No bills recorded yet</div>`;
  if(filtered.length) initDrag('all-list', filtered);
}

let pendingReceiptBase64 = null;
let pendingReceiptMime = null;
let pendingReceiptName = null;

async function handleReceipt(input){
  const file=input.files[0];
  if(!file)return;
  const note=document.getElementById('receipt-note');
  note.textContent='Reading receipt…';
  const reader=new FileReader();
  reader.onload=async(e)=>{
    const base64=e.target.result.split(',')[1];
    const mt=file.type||'image/jpeg';
    pendingReceiptBase64=base64;
    pendingReceiptMime=mt;
    pendingReceiptName=file.name;
    // Show preview for images
    if(mt.startsWith('image/')){
      const prev=document.getElementById('receipt-preview');
      const img=document.getElementById('receipt-img');
      img.src=e.target.result;
      prev.style.display='block';
    }
    try{
      // Step 1: AI scan for bill details
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:400,
          messages:[{role:'user',content:[
            {type:mt==='application/pdf'?'document':'image',source:{type:'base64',media_type:mt,data:base64}},
            {type:'text',text:`You are extracting expense data from an image. The image may be any of these:
- A physical receipt or invoice
- A screenshot of a bank transaction alert email (e.g. Standard Chartered, Maybank, CIMB, RHB, Hong Leong)
- A screenshot of an e-wallet transaction (TNG, GrabPay, Boost)
- A screenshot of an online banking transaction
- A credit/debit card transaction notification

Extract the following:
1. "name": The merchant or payee name. For bank alert emails look for patterns like "successful at MERCHANT NAME", "payment to MERCHANT", "purchase at MERCHANT". Clean up truncated names (e.g. "BANH MI 77 G.." → "Banh Mi 77"). For transfers use the recipient name.
2. "amount": The transaction amount as a plain number (no currency symbol). For Malaysian bank emails look for "MYR XX.XX" or "RM XX.XX". Use the purchase/debit amount, not any fee.
3. "date": Transaction date in YYYY-MM-DD format. Look for dates in the email header, alert timestamp, or transaction details. If only time is shown use today's date.
4. "cat": Best guess category — one of: food, grocery, transport, utilities, health, entertainment, other. Infer from merchant name (e.g. restaurant → food, Petronas → transport, pharmacy → health).
5. "pay": Payment method — one of: applepay, tng, grabpay, debit, credit, cash, bank, boost, other. Infer from context (e.g. Standard Chartered/Maybank/CIMB email → credit or debit, TNG screenshot → tng, GrabPay → grabpay, Apple Pay notification → applepay). Default to "other" if unclear.

Reply ONLY with raw JSON, no markdown, no explanation:
{"name":"...","amount":0.00,"date":"YYYY-MM-DD","cat":"food","pay":"credit"}

Today's date is ${today()}. If anything is truly unclear use: name="Unknown", amount=0, date today, cat="other".`}
          ]}]
        })
      });
      const data=await res.json();
      const txt=data.content.map(i=>i.text||'').join('');
      const clean=txt.replace(/```json|```/g,'').trim();
      const parsed=JSON.parse(clean);
      if(parsed.name)document.getElementById('b-name').value=parsed.name;
      if(parsed.amount)document.getElementById('b-amount').value=parsed.amount;
      if(parsed.date)document.getElementById('b-date').value=parsed.date;
      if(parsed.cat){const sel=document.getElementById('b-cat');if([...sel.options].some(o=>o.value===parsed.cat))sel.value=parsed.cat;}
      if(parsed.pay){const sel=document.getElementById('b-pay');if([...sel.options].some(o=>o.value===parsed.pay))sel.value=parsed.pay;}
      const srcLabel = parsed.name && parsed.name!=='Unknown' ? `<strong>${parsed.name}</strong> — RM ${parsed.amount} detected` : 'Details filled in';
      note.innerHTML='✓ '+srcLabel+' — review then tap <strong>Add bill</strong>.';
    }catch(err){
      note.textContent='Could not read receipt. Please fill in manually.';
    }
  };
  reader.readAsDataURL(file);
}

async function uploadReceiptToDrive(billName, billDate){
  if(!pendingReceiptBase64)return null;
  try{
    const fname='Receipt_'+billName.replace(/[^a-zA-Z0-9]/g,'_')+'_'+billDate+(pendingReceiptMime==='application/pdf'?'.pdf':'.jpg');
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:500,
        messages:[{role:'user',content:`Upload a receipt file named "${fname}" to a folder called "BillTrack/Receipts" in Google Drive. The file is base64 encoded: data:${pendingReceiptMime};base64,${pendingReceiptBase64}. Create the folder if it doesn't exist. Return ONLY JSON: {"fileId":"...","webViewLink":"..."}`}],
        mcp_servers:[{type:'url',url:'https://drivemcp.googleapis.com/mcp/v1',name:'gdrive'}]
      })
    });
    const data=await res.json();
    const txt=data.content.map(i=>i.text||'').join('');
    const clean=txt.replace(/```json|```/g,'').trim();
    const match=clean.match(/\{[^}]*"webViewLink"[^}]*\}/);
    if(match){
      const parsed=JSON.parse(match[0]);
      pendingReceiptBase64=null;pendingReceiptMime=null;pendingReceiptName=null;
      return parsed.webViewLink||parsed.fileId||null;
    }
    return null;
  }catch(e){
    return null;
  }
}

// ── Drag & drop reordering ──────────────────────────────
function initDrag(containerId, filteredList){
  const container = document.getElementById(containerId);
  if(!container) return;
  let dragSrcId = null;
  let touchDragId = null;
  let touchClone = null;
  let touchStartY = 0;

  container.querySelectorAll('.bill-item').forEach(item => {
    // Desktop drag events
    item.addEventListener('dragstart', e => {
      dragSrcId = parseInt(item.dataset.id);
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      container.querySelectorAll('.bill-item').forEach(i => i.classList.remove('drag-over'));
    });
    item.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      container.querySelectorAll('.bill-item').forEach(i => i.classList.remove('drag-over'));
      item.classList.add('drag-over');
    });
    item.addEventListener('drop', e => {
      e.preventDefault();
      const dropId = parseInt(item.dataset.id);
      if(dragSrcId === dropId) return;
      reorderBills(dragSrcId, dropId, filteredList);
    });

    // Touch drag events (mobile)
    const handle = item.querySelector('.drag-handle');
    if(!handle) return;
    handle.addEventListener('touchstart', e => {
      touchDragId = parseInt(item.dataset.id);
      touchStartY = e.touches[0].clientY;
      // Create floating clone
      touchClone = item.cloneNode(true);
      touchClone.style.cssText = `position:fixed;left:${item.getBoundingClientRect().left}px;top:${item.getBoundingClientRect().top}px;width:${item.offsetWidth}px;opacity:0.85;z-index:9999;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,0.15);`;
      document.body.appendChild(touchClone);
      item.classList.add('dragging');
      e.preventDefault();
    }, {passive:false});

    handle.addEventListener('touchmove', e => {
      if(!touchClone) return;
      const dy = e.touches[0].clientY - touchStartY;
      const rect = item.getBoundingClientRect();
      touchClone.style.top = (rect.top + dy) + 'px';
      // Find item under touch
      const els = document.elementsFromPoint(e.touches[0].clientX, e.touches[0].clientY);
      container.querySelectorAll('.bill-item').forEach(i => i.classList.remove('drag-over'));
      const target = els.find(el => el.classList.contains('bill-item') && el !== item);
      if(target) target.classList.add('drag-over');
      e.preventDefault();
    }, {passive:false});

    handle.addEventListener('touchend', e => {
      if(touchClone){document.body.removeChild(touchClone); touchClone=null;}
      item.classList.remove('dragging');
      container.querySelectorAll('.bill-item').forEach(i => i.classList.remove('drag-over'));
      const touch = e.changedTouches[0];
      const els = document.elementsFromPoint(touch.clientX, touch.clientY);
      const target = els.find(el => el.classList.contains('bill-item') && parseInt(el.dataset.id) !== touchDragId);
      if(target){
        reorderBills(touchDragId, parseInt(target.dataset.id), filteredList);
      }
      touchDragId = null;
    });
  });
}

function reorderBills(srcId, dstId, filteredList){
  // Work on global bills array — find positions
  const srcIdx = bills.findIndex(b => b.id === srcId);
  const dstIdx = bills.findIndex(b => b.id === dstId);
  if(srcIdx === -1 || dstIdx === -1) return;
  const [moved] = bills.splice(srcIdx, 1);
  bills.splice(dstIdx, 0, moved);
  save();
  renderAll();
  renderDaily();
  renderWeekly();
}
